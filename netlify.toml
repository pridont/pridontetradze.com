[build]
  command = "pnpm run build"
  publish = "public"
[[redirects]]
  from = "/feed/"
  to = "/feed.xml"
  status = 200

# Security headers. The site inlines all its own CSS/JS, so 'unsafe-inline' is
# unavoidable for style/script; everything else is locked down. img-src allows
# any https host for the remote post covers (imgur/ytimg/angular.dev); the
# Google Fonts hosts are whitelisted for style-src/font-src.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

# Asset caching. Without these, Netlify's default (max-age=0, must-revalidate)
# applies to every image, script and font — each one costs a revalidation round
# trip on every visit despite never changing between deploys.
#
# /img/ filenames are content-hashed by eleventy-img — a changed source means a
# changed URL — so a year with immutable carries no staleness risk at all and
# repeat visitors skip the revalidation entirely.
#
# /assets/ filenames are stable by contrast, so overwriting a file in place has
# to stay safe: a day caps how long a client can hold the old bytes. HTML is
# left on the Netlify default so published content is never stale.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/wavesurfer.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
